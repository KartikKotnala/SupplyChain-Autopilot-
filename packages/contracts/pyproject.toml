[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supplychain-contracts"
version = "1.0.0"
description = "Pydantic v2 core contracts for SupplyChain Autopilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "tabulate>=0.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]
