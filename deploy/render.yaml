services:
  # 1. PostgreSQL 16 Database
  - type: postgres
    name: supplychain-postgres
    region: oregon
    ipAllowList: []
    plan: free

  # 2. CrewAI A2A Service
  - type: web
    name: supplychain-crewai-service
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e packages/contracts && pip install -r requirements.txt
    startCommand: uvicorn services.crewai_service.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supplychain-postgres
          property: connectionString

  # 3. FastAPI Backend & ADK Orchestrator
  - type: web
    name: supplychain-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -e packages/contracts && pip install -r requirements.txt && python data/seed/seed_data.py
    startCommand: uvicorn services.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supplychain-postgres
          property: connectionString
      - key: CREWAI_A2A_URL
        fromService:
          name: supplychain-crewai-service
          type: web
          property: host

  # 4. React 18 Frontend Management Dashboard
  - type: web
    name: supplychain-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
